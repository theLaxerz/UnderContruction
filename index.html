<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenGL Atom Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
        }
        #legend {
            display: flex;
            gap: 18px;
            font-size: 0.85rem;
            opacity: 0.85;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid rgba(100, 180, 255, 0.15);
            min-width: 200px;
        }
        #controls label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem;
            opacity: 0.9;
        }
        #controls input[type="range"] {
            width: 100%;
            accent-color: #4af;
        }
        #controls select {
            background: rgba(20, 30, 50, 0.8);
            color: #fff;
            border: 1px solid rgba(100, 180, 255, 0.3);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            opacity: 0.5;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas"></canvas>

    <div id="ui">
        <h1>ATOM SIMULATOR</h1>
        <div id="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: #ff4444;"></div>
                <span>Proton (+)</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #4488ff;"></div>
                <span>Neutron</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #44ff88;"></div>
                <span>Electron (-)</span>
            </div>
        </div>
    </div>

    <div id="controls">
        <label>
            Element
            <select id="element">
                <option value="1">Hydrogen (1)</option>
                <option value="2">Helium (2)</option>
                <option value="3">Lithium (3)</option>
                <option value="6" selected>Carbon (6)</option>
                <option value="7">Nitrogen (7)</option>
                <option value="8">Oxygen (8)</option>
                <option value="10">Neon (10)</option>
                <option value="11">Sodium (11)</option>
                <option value="14">Silicon (14)</option>
                <option value="26">Iron (26)</option>
            </select>
        </label>
        <label>
            Orbit Speed
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        </label>
        <label>
            Zoom
            <input type="range" id="zoom" min="3" max="15" step="0.5" value="7">
        </label>
    </div>

    <div id="info">Click & drag to rotate | Scroll to zoom</div>

    <script>
/**
 * Minimal gl-matrix functions for WebGL atom simulator.
 */
const glMatrix = {};

glMatrix.mat4 = {
    create() {
        const out = new Float32Array(16);
        out[0] = 1; out[5] = 1; out[10] = 1; out[15] = 1;
        return out;
    },
    perspective(out, fovy, aspect, near, far) {
        const f = 1.0 / Math.tan(fovy / 2);
        const nf = 1 / (near - far);
        out[0] = f / aspect;
        out[1] = 0; out[2] = 0; out[3] = 0;
        out[4] = 0; out[5] = f;
        out[6] = 0; out[7] = 0;
        out[8] = 0; out[9] = 0;
        out[10] = (far + near) * nf;
        out[11] = -1;
        out[12] = 0; out[13] = 0;
        out[14] = 2 * far * near * nf;
        out[15] = 0;
        return out;
    },
    lookAt(out, eye, center, up) {
        let x0, x1, x2, y0, y1, y2, z0, z1, z2, len;
        const eyex = eye[0], eyey = eye[1], eyez = eye[2];
        const upx = up[0], upy = up[1], upz = up[2];
        const centerx = center[0], centery = center[1], centerz = center[2];
        z0 = eyex - centerx; z1 = eyey - centery; z2 = eyez - centerz;
        len = 1 / Math.sqrt(z0*z0 + z1*z1 + z2*z2);
        z0 *= len; z1 *= len; z2 *= len;
        x0 = upy*z2 - upz*z1; x1 = upz*z0 - upx*z2; x2 = upx*z1 - upy*z0;
        len = Math.sqrt(x0*x0 + x1*x1 + x2*x2);
        if (len) { len = 1/len; x0 *= len; x1 *= len; x2 *= len; }
        y0 = z1*x2 - z2*x1; y1 = z2*x0 - z0*x2; y2 = z0*x1 - z1*x0;
        len = Math.sqrt(y0*y0 + y1*y1 + y2*y2);
        if (len) { len = 1/len; y0 *= len; y1 *= len; y2 *= len; }
        out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
        out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
        out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
        out[12] = -(x0*eyex + x1*eyey + x2*eyez);
        out[13] = -(y0*eyex + y1*eyey + y2*eyez);
        out[14] = -(z0*eyex + z1*eyey + z2*eyez);
        out[15] = 1;
        return out;
    },
    identity(out) { out.fill(0); out[0]=1; out[5]=1; out[10]=1; out[15]=1; return out; },
    multiply(out, a, b) {
        const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7];
        const a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
        let b0,b1,b2,b3;
        b0=b[0];b1=b[1];b2=b[2];b3=b[3];
        out[0]=b0*a00+b1*a10+b2*a20+b3*a30;out[1]=b0*a01+b1*a11+b2*a21+b3*a31;
        out[2]=b0*a02+b1*a12+b2*a22+b3*a32;out[3]=b0*a03+b1*a13+b2*a23+b3*a33;
        b0=b[4];b1=b[5];b2=b[6];b3=b[7];
        out[4]=b0*a00+b1*a10+b2*a20+b3*a30;out[5]=b0*a01+b1*a11+b2*a21+b3*a31;
        out[6]=b0*a02+b1*a12+b2*a22+b3*a32;out[7]=b0*a03+b1*a13+b2*a23+b3*a33;
        b0=b[8];b1=b[9];b2=b[10];b3=b[11];
        out[8]=b0*a00+b1*a10+b2*a20+b3*a30;out[9]=b0*a01+b1*a11+b2*a21+b3*a31;
        out[10]=b0*a02+b1*a12+b2*a22+b3*a32;out[11]=b0*a03+b1*a13+b2*a23+b3*a33;
        b0=b[12];b1=b[13];b2=b[14];b3=b[15];
        out[12]=b0*a00+b1*a10+b2*a20+b3*a30;out[13]=b0*a01+b1*a11+b2*a21+b3*a31;
        out[14]=b0*a02+b1*a12+b2*a22+b3*a32;out[15]=b0*a03+b1*a13+b2*a23+b3*a33;
        return out;
    },
    translate(out, a, v) {
        const x=v[0],y=v[1],z=v[2];
        if(a===out){out[12]=a[0]*x+a[4]*y+a[8]*z+a[12];out[13]=a[1]*x+a[5]*y+a[9]*z+a[13];
        out[14]=a[2]*x+a[6]*y+a[10]*z+a[14];out[15]=a[3]*x+a[7]*y+a[11]*z+a[15];}else{
        const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11];
        out[0]=a00;out[1]=a01;out[2]=a02;out[3]=a03;out[4]=a10;out[5]=a11;out[6]=a12;out[7]=a13;
        out[8]=a20;out[9]=a21;out[10]=a22;out[11]=a23;
        out[12]=a00*x+a10*y+a20*z+a[12];out[13]=a01*x+a11*y+a21*z+a[13];
        out[14]=a02*x+a12*y+a22*z+a[14];out[15]=a03*x+a13*y+a23*z+a[15];}
        return out;
    },
    scale(out, a, v) {
        const x=v[0],y=v[1],z=v[2];
        out[0]=a[0]*x;out[1]=a[1]*x;out[2]=a[2]*x;out[3]=a[3]*x;
        out[4]=a[4]*y;out[5]=a[5]*y;out[6]=a[6]*y;out[7]=a[7]*y;
        out[8]=a[8]*z;out[9]=a[9]*z;out[10]=a[10]*z;out[11]=a[11]*z;
        out[12]=a[12];out[13]=a[13];out[14]=a[14];out[15]=a[15];
        return out;
    },
    copy(out, a) { for(let i=0;i<16;i++) out[i]=a[i]; return out; }
};

glMatrix.mat3 = {
    create() { const o=new Float32Array(9); o[0]=1;o[4]=1;o[8]=1; return o; },
    normalFromMat4(out, a) {
        const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7];
        const a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
        const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10;
        const b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12;
        const b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30;
        const b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
        let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
        if(!det) return null; det=1.0/det;
        out[0]=(a11*b11-a12*b10+a13*b09)*det;out[1]=(a12*b08-a10*b11-a13*b07)*det;
        out[2]=(a10*b10-a11*b08+a13*b06)*det;out[3]=(a02*b10-a01*b11-a03*b09)*det;
        out[4]=(a00*b11-a02*b08+a03*b07)*det;out[5]=(a01*b08-a00*b10-a03*b06)*det;
        out[6]=(a31*b05-a32*b04+a33*b03)*det;out[7]=(a32*b02-a30*b05-a33*b01)*det;
        out[8]=(a30*b04-a31*b02+a33*b00)*det;
        return out;
    }
};
    </script>
    <script>
/**
 * WebGL Atom Simulator
 */
(function () {
    'use strict';
    const { mat4, mat3 } = glMatrix;

    const ELEMENTS = {
        1:  { name:'Hydrogen',  p:1,  n:0,  shells:[1] },
        2:  { name:'Helium',    p:2,  n:2,  shells:[2] },
        3:  { name:'Lithium',   p:3,  n:4,  shells:[2,1] },
        6:  { name:'Carbon',    p:6,  n:6,  shells:[2,4] },
        7:  { name:'Nitrogen',  p:7,  n:7,  shells:[2,5] },
        8:  { name:'Oxygen',    p:8,  n:8,  shells:[2,6] },
        10: { name:'Neon',      p:10, n:10, shells:[2,8] },
        11: { name:'Sodium',    p:11, n:12, shells:[2,8,1] },
        14: { name:'Silicon',   p:14, n:14, shells:[2,8,4] },
        26: { name:'Iron',      p:26, n:30, shells:[2,8,14,2] },
    };

    const COLOR_PROTON   = [1.0, 0.27, 0.27];
    const COLOR_NEUTRON  = [0.27, 0.53, 1.0];
    const COLOR_ELECTRON = [0.27, 1.0, 0.53];

    const canvas = document.getElementById('glcanvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) {
        document.body.innerHTML = '<h1 style="color:#f44;text-align:center;margin-top:40vh">WebGL not supported</h1>';
        return;
    }

    function resize() {
        canvas.width = window.innerWidth * devicePixelRatio;
        canvas.height = window.innerHeight * devicePixelRatio;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    const VS_SOURCE = `
        attribute vec3 aPosition; attribute vec3 aNormal;
        uniform mat4 uModelView; uniform mat4 uProjection; uniform mat3 uNormalMatrix;
        varying vec3 vNormal; varying vec3 vPosition;
        void main() {
            vec4 mvPos = uModelView * vec4(aPosition, 1.0);
            vPosition = mvPos.xyz; vNormal = normalize(uNormalMatrix * aNormal);
            gl_Position = uProjection * mvPos;
        }`;
    const FS_SOURCE = `
        precision mediump float;
        varying vec3 vNormal; varying vec3 vPosition;
        uniform vec3 uColor; uniform vec3 uLightDir; uniform float uGlow;
        void main() {
            vec3 N = normalize(vNormal); vec3 L = normalize(uLightDir - vPosition);
            vec3 V = normalize(-vPosition); vec3 H = normalize(L + V);
            float diff = max(dot(N, L), 0.0); float spec = pow(max(dot(N, H), 0.0), 64.0);
            vec3 ambient = 0.15 * uColor; vec3 diffuse = 0.7 * diff * uColor;
            vec3 specular = 0.6 * spec * vec3(1.0);
            float rim = pow(1.0 - max(dot(V, N), 0.0), 3.0) * uGlow;
            gl_FragColor = vec4(ambient + diffuse + specular + uColor * rim * 0.8, 1.0);
        }`;
    const VS_RING = `
        attribute vec3 aPosition; uniform mat4 uModelView; uniform mat4 uProjection;
        void main() { gl_Position = uProjection * uModelView * vec4(aPosition, 1.0); }`;
    const FS_RING = `
        precision mediump float; uniform vec3 uColor; uniform float uAlpha;
        void main() { gl_FragColor = vec4(uColor, uAlpha); }`;

    function compileShader(type, src) {
        const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
        return s;
    }
    function createProgram(vs, fs) {
        const p = gl.createProgram();
        gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs));
        gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(p); return p;
    }

    const sphereProgram = createProgram(VS_SOURCE, FS_SOURCE);
    const ringProgram = createProgram(VS_RING, FS_RING);

    const sp = {
        aPosition: gl.getAttribLocation(sphereProgram, 'aPosition'),
        aNormal: gl.getAttribLocation(sphereProgram, 'aNormal'),
        uModelView: gl.getUniformLocation(sphereProgram, 'uModelView'),
        uProjection: gl.getUniformLocation(sphereProgram, 'uProjection'),
        uNormalMatrix: gl.getUniformLocation(sphereProgram, 'uNormalMatrix'),
        uColor: gl.getUniformLocation(sphereProgram, 'uColor'),
        uLightDir: gl.getUniformLocation(sphereProgram, 'uLightDir'),
        uGlow: gl.getUniformLocation(sphereProgram, 'uGlow'),
    };
    const rp = {
        aPosition: gl.getAttribLocation(ringProgram, 'aPosition'),
        uModelView: gl.getUniformLocation(ringProgram, 'uModelView'),
        uProjection: gl.getUniformLocation(ringProgram, 'uProjection'),
        uColor: gl.getUniformLocation(ringProgram, 'uColor'),
        uAlpha: gl.getUniformLocation(ringProgram, 'uAlpha'),
    };

    function createSphere(latB, lonB) {
        const pos=[], norm=[], idx=[];
        for(let la=0;la<=latB;la++){const t=la*Math.PI/latB,sT=Math.sin(t),cT=Math.cos(t);
        for(let lo=0;lo<=lonB;lo++){const p=lo*2*Math.PI/lonB,x=Math.cos(p)*sT,y=cT,z=Math.sin(p)*sT;
        norm.push(x,y,z);pos.push(x,y,z);}}
        for(let la=0;la<latB;la++)for(let lo=0;lo<lonB;lo++){const f=la*(lonB+1)+lo,s=f+lonB+1;
        idx.push(f,s,f+1,s,s+1,f+1);}
        const pB=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pB);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
        const nB=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,nB);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(norm),gl.STATIC_DRAW);
        const iB=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iB);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
        return {posBuffer:pB,normBuffer:nB,idxBuffer:iB,count:idx.length};
    }
    const sphereHi=createSphere(24,24), sphereLo=createSphere(12,12);

    function createRing(radius, segs) {
        const p=[];for(let i=0;i<=segs;i++){const a=(i/segs)*2*Math.PI;p.push(Math.cos(a)*radius,0,Math.sin(a)*radius);}
        const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(p),gl.STATIC_DRAW);
        return {buffer:b,count:segs+1};
    }

    function drawSphere(vM, pos, r, col, glow, mesh) {
        gl.useProgram(sphereProgram);
        const mv=mat4.create();mat4.translate(mv,vM,pos);mat4.scale(mv,mv,[r,r,r]);
        const nm=mat3.create();mat3.normalFromMat4(nm,mv);
        gl.uniformMatrix4fv(sp.uModelView,false,mv);gl.uniformMatrix3fv(sp.uNormalMatrix,false,nm);
        gl.uniform3fv(sp.uColor,col);gl.uniform1f(sp.uGlow,glow);
        gl.bindBuffer(gl.ARRAY_BUFFER,mesh.posBuffer);gl.enableVertexAttribArray(sp.aPosition);
        gl.vertexAttribPointer(sp.aPosition,3,gl.FLOAT,false,0,0);
        gl.bindBuffer(gl.ARRAY_BUFFER,mesh.normBuffer);gl.enableVertexAttribArray(sp.aNormal);
        gl.vertexAttribPointer(sp.aNormal,3,gl.FLOAT,false,0,0);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.idxBuffer);
        gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_SHORT,0);
    }

    function drawRing(vM, radius, tX, tZ, col, alpha) {
        gl.useProgram(ringProgram);
        const ring=createRing(radius,128),mv=mat4.create();mat4.copy(mv,vM);
        const cX=Math.cos(tX),sX=Math.sin(tX),cZ=Math.cos(tZ),sZ=Math.sin(tZ);
        const rX=mat4.create();rX[5]=cX;rX[6]=sX;rX[9]=-sX;rX[10]=cX;
        const rZ=mat4.create();rZ[0]=cZ;rZ[1]=sZ;rZ[4]=-sZ;rZ[5]=cZ;
        mat4.multiply(mv,mv,rZ);mat4.multiply(mv,mv,rX);
        gl.uniformMatrix4fv(rp.uModelView,false,mv);gl.uniform3fv(rp.uColor,col);gl.uniform1f(rp.uAlpha,alpha);
        gl.bindBuffer(gl.ARRAY_BUFFER,ring.buffer);gl.enableVertexAttribArray(rp.aPosition);
        gl.vertexAttribPointer(rp.aPosition,3,gl.FLOAT,false,0,0);
        gl.drawArrays(gl.LINE_STRIP,0,ring.count);
    }

    function layoutNucleus(protons, neutrons) {
        const total=protons+neutrons,parts=[],sp=0.42;
        for(let i=0;i<total;i++){const phi=Math.acos(1-2*(i+0.5)/total),theta=Math.PI*(1+Math.sqrt(5))*i;
        const layer=Math.cbrt((i+1)/total),r=layer*sp*Math.cbrt(total)*0.5;
        parts.push({pos:[r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi)],
        isProton:i<protons,wP:Math.random()*Math.PI*2,wS:0.5+Math.random(),wA:0.02+Math.random()*0.02});}
        return parts;
    }

    function layoutElectrons(shells) {
        const el=[];shells.forEach((c,si)=>{const oR=2.0+si*1.2,tX=si*0.4+0.2,tZ=si*0.7;
        for(let i=0;i<c;i++) el.push({orbitRadius:oR,phase:(i/c)*Math.PI*2,speed:1.5-si*0.25,tiltX:tX,tiltZ:tZ});});
        return el;
    }

    let camRotX=0.3,camRotY=0,camDist=7,dragging=false,lastMouse={x:0,y:0};
    canvas.addEventListener('mousedown',e=>{dragging=true;lastMouse={x:e.clientX,y:e.clientY};});
    window.addEventListener('mouseup',()=>dragging=false);
    window.addEventListener('mousemove',e=>{if(!dragging)return;camRotY+=(e.clientX-lastMouse.x)*0.008;
    camRotX+=(e.clientY-lastMouse.y)*0.008;camRotX=Math.max(-1.47,Math.min(1.47,camRotX));
    lastMouse={x:e.clientX,y:e.clientY};});
    canvas.addEventListener('wheel',e=>{e.preventDefault();camDist+=e.deltaY*0.01;
    camDist=Math.max(3,Math.min(20,camDist));document.getElementById('zoom').value=camDist;},{passive:false});
    canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lastMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};}});
    canvas.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&dragging){
    camRotY+=(e.touches[0].clientX-lastMouse.x)*0.008;camRotX+=(e.touches[0].clientY-lastMouse.y)*0.008;
    camRotX=Math.max(-1.47,Math.min(1.47,camRotX));lastMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};}},{passive:false});
    canvas.addEventListener('touchend',()=>dragging=false);

    let currentElement=6,nucleons=[],electrons=[],orbitSpeed=1.0;
    function buildAtom(n){const el=ELEMENTS[n];if(!el)return;currentElement=n;nucleons=layoutNucleus(el.p,el.n);electrons=layoutElectrons(el.shells);}
    buildAtom(currentElement);
    document.getElementById('element').addEventListener('change',e=>buildAtom(parseInt(e.target.value)));
    document.getElementById('speed').addEventListener('input',e=>orbitSpeed=parseFloat(e.target.value));
    document.getElementById('zoom').addEventListener('input',e=>camDist=parseFloat(e.target.value));

    gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0.02,0.03,0.06,1.0);
    const projM=mat4.create(),viewM=mat4.create();let time=0;

    function render(){
        requestAnimationFrame(render);
        time+=orbitSpeed/60;resize();
        gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
        mat4.perspective(projM,Math.PI/4,canvas.width/canvas.height,0.1,100.0);
        const eX=camDist*Math.sin(camRotY)*Math.cos(camRotX),eY=camDist*Math.sin(camRotX),eZ=camDist*Math.cos(camRotY)*Math.cos(camRotX);
        mat4.lookAt(viewM,[eX,eY,eZ],[0,0,0],[0,1,0]);
        gl.useProgram(sphereProgram);gl.uniformMatrix4fv(sp.uProjection,false,projM);gl.uniform3fv(sp.uLightDir,[5,8,6]);

        nucleons.forEach(n=>{const w=Math.sin(time*n.wS+n.wP)*n.wA;
        drawSphere(viewM,[n.pos[0]+w,n.pos[1]+w*0.7,n.pos[2]+w*0.5],0.2,n.isProton?COLOR_PROTON:COLOR_NEUTRON,0.5,sphereHi);});

        gl.useProgram(ringProgram);gl.uniformMatrix4fv(rp.uProjection,false,projM);
        ELEMENTS[currentElement].shells.forEach((c,si)=>drawRing(viewM,2.0+si*1.2,si*0.4+0.2,si*0.7,[0.2,0.5,0.8],0.2));

        gl.useProgram(sphereProgram);gl.uniformMatrix4fv(sp.uProjection,false,projM);
        electrons.forEach(e=>{const a=time*e.speed+e.phase,x=Math.cos(a)*e.orbitRadius,z=Math.sin(a)*e.orbitRadius;
        const cX=Math.cos(e.tiltX),sX=Math.sin(e.tiltX),cZ=Math.cos(e.tiltZ),sZ=Math.sin(e.tiltZ);
        const y1=-z*sX,z1=z*cX,x2=x*cZ-y1*sZ,y2=x*sZ+y1*cZ;
        drawSphere(viewM,[x2,y2,z1],0.12,COLOR_ELECTRON,1.5,sphereLo);});
    }
    requestAnimationFrame(render);
})();
    </script>
</body>
</html>
