<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom Simulator — WebGPU Raycast</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
        }
        #subtitle {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        #legend {
            display: flex;
            gap: 18px;
            font-size: 0.85rem;
            opacity: 0.85;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid rgba(100, 180, 255, 0.15);
            min-width: 200px;
        }
        #controls label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem;
            opacity: 0.9;
        }
        #controls input[type="range"] { width: 100%; accent-color: #4af; }
        #controls select {
            background: rgba(20, 30, 50, 0.8);
            color: #fff;
            border: 1px solid rgba(100, 180, 255, 0.3);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            opacity: 0.5;
            z-index: 10;
        }
        #error {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 100;
            background: #0a0b14;
            color: #f44;
            text-align: center;
            padding-top: 35vh;
            font-size: 1.3rem;
        }
        #error p { color: #aaa; font-size: 0.9rem; margin-top: 12px; }
    </style>
</head>
<body>
    <canvas id="gpucanvas"></canvas>

    <div id="error">
        WebGPU is not supported in this browser.
        <p>Try Chrome 113+, Edge 113+, or Firefox Nightly with dom.webgpu.enabled.</p>
    </div>

    <div id="ui">
        <h1>ATOM SIMULATOR</h1>
        <div id="subtitle">WebGPU RAYCAST RENDERER</div>
        <div id="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: #ff4444;"></div>
                <span>Proton (+)</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #4488ff;"></div>
                <span>Neutron</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #44ff88;"></div>
                <span>Electron (-)</span>
            </div>
        </div>
    </div>

    <div id="controls">
        <label>
            Element
            <select id="element">
                <option value="1">Hydrogen (1)</option>
                <option value="2">Helium (2)</option>
                <option value="3">Lithium (3)</option>
                <option value="6" selected>Carbon (6)</option>
                <option value="7">Nitrogen (7)</option>
                <option value="8">Oxygen (8)</option>
                <option value="10">Neon (10)</option>
                <option value="11">Sodium (11)</option>
                <option value="14">Silicon (14)</option>
                <option value="26">Iron (26)</option>
            </select>
        </label>
        <label>
            Orbit Speed
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        </label>
        <label>
            Zoom
            <input type="range" id="zoom" min="3" max="15" step="0.5" value="7">
        </label>
    </div>

    <div id="info">Click &amp; drag to rotate | Scroll to zoom | WebGPU Raycast</div>

    <script>
// ─── WGSL Shader ───────────────────────────────────────────────────
const WGSL = `
struct Sphere {
    posRadius: vec4<f32>,
    colorGlow: vec4<f32>,
};
struct Ring {
    params: vec4<f32>,
};
struct Uniforms {
    invVP: mat4x4<f32>,
    camPosTime: vec4<f32>,
    resCounts: vec4<f32>,
    lightPos: vec4<f32>,
};

@group(0) @binding(0) var<uniform> u: Uniforms;
@group(0) @binding(1) var<storage, read> spheres: array<Sphere>;
@group(0) @binding(2) var<storage, read> rings: array<Ring>;

struct VOut { @builtin(position) pos: vec4<f32>, };

@vertex fn vs(@builtin(vertex_index) vid: u32) -> VOut {
    var p = array<vec2<f32>, 3>(vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
    var out: VOut;
    out.pos = vec4(p[vid], 0.0, 1.0);
    return out;
}

fn hitSphere(ro: vec3<f32>, rd: vec3<f32>, c: vec3<f32>, r: f32) -> f32 {
    let oc = ro - c;
    let b = dot(oc, rd);
    let det = b * b - (dot(oc, oc) - r * r);
    if (det < 0.0) { return -1.0; }
    let sd = sqrt(det);
    let t1 = -b - sd;
    if (t1 > 0.001) { return t1; }
    let t2 = -b + sd;
    if (t2 > 0.001) { return t2; }
    return -1.0;
}

fn softShadow(ro: vec3<f32>, rd: vec3<f32>, maxT: f32, k: f32, cnt: u32) -> f32 {
    var res = 1.0;
    for (var i = 0u; i < cnt; i++) {
        let s = spheres[i];
        let oc = ro - s.posRadius.xyz;
        let b = dot(oc, rd);
        let det = b * b - (dot(oc, oc) - s.posRadius.w * s.posRadius.w);
        if (det > 0.0) {
            let sd = sqrt(det);
            let t = -b - sd;
            if (t > 0.01 && t < maxT) {
                res = min(res, k * sd / max(t, 0.01));
            }
        }
    }
    return clamp(res, 0.1, 1.0);
}

fn rotX(p: vec3<f32>, a: f32) -> vec3<f32> {
    let c = cos(a); let s = sin(a);
    return vec3(p.x, p.y*c - p.z*s, p.y*s + p.z*c);
}
fn rotZ(p: vec3<f32>, a: f32) -> vec3<f32> {
    let c = cos(a); let s = sin(a);
    return vec3(p.x*c - p.y*s, p.x*s + p.y*c, p.z);
}

@fragment fn fs(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
    let res = u.resCounts.xy;
    let uv = (fc.xy / res) * 2.0 - 1.0;

    let near4 = u.invVP * vec4(uv.x, -uv.y, 0.0, 1.0);
    let far4  = u.invVP * vec4(uv.x, -uv.y, 1.0, 1.0);
    let nP = near4.xyz / near4.w;
    let fP = far4.xyz / far4.w;
    let ro = nP;
    let rd = normalize(fP - nP);

    let sCnt = u32(u.resCounts.z);
    let rCnt = u32(u.resCounts.w);
    let lp = u.lightPos.xyz;
    let cp = u.camPosTime.xyz;

    // ── Find closest sphere hit ──
    var cT = 1e20;
    var cI = -1;
    for (var i = 0u; i < sCnt; i++) {
        let t = hitSphere(ro, rd, spheres[i].posRadius.xyz, spheres[i].posRadius.w);
        if (t > 0.0 && t < cT) { cT = t; cI = i32(i); }
    }

    // ── Orbit ring glow ──
    var ringGlow = vec3(0.0);
    for (var r = 0u; r < rCnt; r++) {
        let rng = rings[r];
        let rad = rng.params.x;
        let tX = rng.params.y;
        let tZ = rng.params.z;
        let lro = rotX(rotZ(ro, -tZ), -tX);
        let lrd = rotX(rotZ(rd, -tZ), -tX);
        if (abs(lrd.y) > 0.0001) {
            let t = -lro.y / lrd.y;
            if (t > 0.0 && (cI < 0 || t < cT)) {
                let hp = lro + lrd * t;
                let d = length(vec2(hp.x, hp.z));
                let rDist = abs(d - rad);
                let glow = exp(-rDist * 18.0) * 0.5;
                let fade = exp(-t * 0.04);
                ringGlow += vec3(0.25, 0.5, 1.0) * glow * fade;
            }
        }
    }

    // ── Background ──
    if (cI < 0) {
        let bgY = uv.y * 0.5 + 0.5;
        let bg = mix(vec3(0.015, 0.02, 0.04), vec3(0.03, 0.04, 0.08), bgY);
        // Subtle star field from hash
        let h = fract(sin(dot(floor(fc.xy * 0.5), vec2(127.1, 311.7))) * 43758.5453);
        let star = select(0.0, h * 0.4, h > 0.997);
        return vec4(bg + ringGlow + vec3(star), 1.0);
    }

    // ── Shade hit point ──
    let s = spheres[cI];
    let hp = ro + rd * cT;
    let N = normalize(hp - s.posRadius.xyz);
    let col = s.colorGlow.xyz;
    let glow = s.colorGlow.w;

    let L = normalize(lp - hp);
    let V = normalize(cp - hp);
    let H = normalize(L + V);

    let diff = max(dot(N, L), 0.0);
    let spec = pow(max(dot(N, H), 0.0), 80.0);
    let rim = pow(1.0 - max(dot(V, N), 0.0), 3.0) * glow;

    // Soft shadow
    let shadow = softShadow(hp + N * 0.02, L, 30.0, 6.0, sCnt);

    // Ambient occlusion
    var ao = 1.0;
    for (var i = 0u; i < sCnt; i++) {
        if (i32(i) == cI) { continue; }
        let os = spheres[i];
        let d = length(hp - os.posRadius.xyz);
        let inf = os.posRadius.w * 3.5;
        if (d < inf) { ao -= (1.0 - d / inf) * 0.12; }
    }
    ao = max(ao, 0.25);

    let ambient = 0.1 * col;
    let diffC = 0.75 * diff * shadow * col;
    let specC = 0.55 * spec * shadow * vec3(1.0);
    let rimC = col * rim * 0.7;

    var final_col = (ambient + diffC + specC + rimC) * ao;

    // ── One-bounce reflection ──
    let rfl = reflect(rd, N);
    var rT = 1e20;
    var rI = -1;
    for (var i = 0u; i < sCnt; i++) {
        if (i32(i) == cI) { continue; }
        let t = hitSphere(hp + N * 0.02, rfl, spheres[i].posRadius.xyz, spheres[i].posRadius.w);
        if (t > 0.0 && t < rT) { rT = t; rI = i32(i); }
    }
    if (rI >= 0) {
        let rHp = hp + N * 0.02 + rfl * rT;
        let rN = normalize(rHp - spheres[rI].posRadius.xyz);
        let rL = normalize(lp - rHp);
        let rDiff = max(dot(rN, rL), 0.0);
        let rSpec = pow(max(dot(rN, normalize(rL + V)), 0.0), 40.0);
        let rCol = spheres[rI].colorGlow.xyz * rDiff * 0.35 + vec3(rSpec * 0.2);
        let fresnel = pow(1.0 - max(dot(V, N), 0.0), 5.0) * 0.35;
        final_col += rCol * fresnel;
    }

    // ── Electron trail glow (additive bloom on electrons) ──
    if (glow > 1.0) {
        final_col += col * 0.08;
    }

    final_col += ringGlow;

    return vec4(final_col, 1.0);
}
`;

// ─── Matrix Math (minimal, inlined) ────────────────────────────────
function mat4Perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}
function mat4LookAt(eye, center, up) {
    const [ex,ey,ez] = eye, [cx,cy,cz] = center, [ux,uy,uz] = up;
    let zx=ex-cx,zy=ey-cy,zz=ez-cz, l=1/Math.sqrt(zx*zx+zy*zy+zz*zz);
    zx*=l;zy*=l;zz*=l;
    let xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;
    l=Math.sqrt(xx*xx+xy*xy+xz*xz); if(l){l=1/l;xx*=l;xy*=l;xz*=l;}
    let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    l=Math.sqrt(yx*yx+yy*yy+yz*yz); if(l){l=1/l;yx*=l;yy*=l;yz*=l;}
    return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
        -(xx*ex+xy*ey+xz*ez), -(yx*ex+yy*ey+yz*ez), -(zx*ex+zy*ey+zz*ez), 1]);
}
function mat4Mul(a, b) {
    const o = new Float32Array(16);
    for (let i=0;i<4;i++) for (let j=0;j<4;j++) {
        o[j*4+i] = a[i]*b[j*4] + a[4+i]*b[j*4+1] + a[8+i]*b[j*4+2] + a[12+i]*b[j*4+3];
    }
    return o;
}
function mat4Invert(m) {
    const o = new Float32Array(16);
    const [a00,a01,a02,a03, a10,a11,a12,a13, a20,a21,a22,a23, a30,a31,a32,a33] = m;
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10;
    const b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12;
    const b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30;
    const b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; if(!d) return o; d=1/d;
    o[0]=(a11*b11-a12*b10+a13*b09)*d; o[1]=(a02*b10-a01*b11-a03*b09)*d;
    o[2]=(a31*b05-a32*b04+a33*b03)*d; o[3]=(a22*b04-a21*b05-a23*b03)*d;
    o[4]=(a12*b08-a10*b11-a13*b07)*d; o[5]=(a00*b11-a02*b08+a03*b07)*d;
    o[6]=(a32*b02-a30*b05-a33*b01)*d; o[7]=(a20*b05-a22*b02+a23*b01)*d;
    o[8]=(a10*b10-a11*b08+a13*b06)*d; o[9]=(a01*b08-a00*b10-a03*b06)*d;
    o[10]=(a30*b04-a31*b02+a33*b00)*d; o[11]=(a21*b02-a20*b04-a23*b00)*d;
    o[12]=(a11*b07-a10*b09-a12*b06)*d; o[13]=(a00*b09-a01*b07+a02*b06)*d;
    o[14]=(a31*b01-a30*b03-a32*b00)*d; o[15]=(a20*b03-a21*b01+a22*b00)*d;
    return o;
}

// ─── Element Data ──────────────────────────────────────────────────
const ELEMENTS = {
    1:  { p:1,  n:0,  shells:[1] },
    2:  { p:2,  n:2,  shells:[2] },
    3:  { p:3,  n:4,  shells:[2,1] },
    6:  { p:6,  n:6,  shells:[2,4] },
    7:  { p:7,  n:7,  shells:[2,5] },
    8:  { p:8,  n:8,  shells:[2,6] },
    10: { p:10, n:10, shells:[2,8] },
    11: { p:11, n:12, shells:[2,8,1] },
    14: { p:14, n:14, shells:[2,8,4] },
    26: { p:26, n:30, shells:[2,8,14,2] },
};
const COL_PROTON  = [1.0, 0.27, 0.27];
const COL_NEUTRON = [0.27, 0.53, 1.0];
const COL_ELECTRON = [0.27, 1.0, 0.53];
const MAX_SPHERES = 128;
const MAX_RINGS = 8;

// ─── Atom Layout ───────────────────────────────────────────────────
function layoutNucleus(protons, neutrons) {
    const total = protons + neutrons, parts = [], sp = 0.42;
    for (let i = 0; i < total; i++) {
        const phi = Math.acos(1 - 2 * (i + 0.5) / total);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        const layer = Math.cbrt((i + 1) / total);
        const r = layer * sp * Math.cbrt(total) * 0.5;
        parts.push({
            pos: [r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi)],
            isProton: i < protons,
            wP: Math.random() * Math.PI * 2,
            wS: 0.5 + Math.random(),
            wA: 0.02 + Math.random() * 0.02,
        });
    }
    return parts;
}
function layoutElectrons(shells) {
    const el = [];
    shells.forEach((c, si) => {
        const oR = 2.0 + si * 1.2, tX = si * 0.4 + 0.2, tZ = si * 0.7;
        for (let i = 0; i < c; i++)
            el.push({ orbitRadius: oR, phase: (i/c)*Math.PI*2, speed: 1.5-si*0.25, tiltX: tX, tiltZ: tZ });
    });
    return el;
}

// ─── App State ─────────────────────────────────────────────────────
let currentElement = 6, nucleons = [], electrons = [], orbitSpeed = 1.0;
let camRotX = 0.3, camRotY = 0, camDist = 7, dragging = false, lastMouse = {x:0, y:0};
let time = 0;

function buildAtom(z) {
    const el = ELEMENTS[z]; if (!el) return;
    currentElement = z;
    nucleons = layoutNucleus(el.p, el.n);
    electrons = layoutElectrons(el.shells);
}
buildAtom(currentElement);

// ─── Controls ──────────────────────────────────────────────────────
const canvas = document.getElementById('gpucanvas');
document.getElementById('element').addEventListener('change', e => buildAtom(parseInt(e.target.value)));
document.getElementById('speed').addEventListener('input', e => orbitSpeed = parseFloat(e.target.value));
document.getElementById('zoom').addEventListener('input', e => camDist = parseFloat(e.target.value));
canvas.addEventListener('mousedown', e => { dragging = true; lastMouse = {x:e.clientX, y:e.clientY}; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
    if (!dragging) return;
    camRotY += (e.clientX - lastMouse.x) * 0.008;
    camRotX += (e.clientY - lastMouse.y) * 0.008;
    camRotX = Math.max(-1.47, Math.min(1.47, camRotX));
    lastMouse = {x: e.clientX, y: e.clientY};
});
canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camDist += e.deltaY * 0.01;
    camDist = Math.max(3, Math.min(20, camDist));
    document.getElementById('zoom').value = camDist;
}, {passive: false});
canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { dragging = true; lastMouse = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
        camRotY += (e.touches[0].clientX - lastMouse.x) * 0.008;
        camRotX += (e.touches[0].clientY - lastMouse.y) * 0.008;
        camRotX = Math.max(-1.47, Math.min(1.47, camRotX));
        lastMouse = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    }
}, {passive: false});
canvas.addEventListener('touchend', () => dragging = false);

// ─── WebGPU Init ───────────────────────────────────────────────────
async function init() {
    const errDiv = document.getElementById('error');
    function showError(msg) { errDiv.querySelector('p').textContent = msg; errDiv.style.display = 'block'; }
    if (!navigator.gpu) { showError('WebGPU API not available. Try Chrome 113+, Edge 113+, or Firefox Nightly.'); return; }
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) { showError('No WebGPU adapter found. Your GPU may not support WebGPU.'); return; }
    let device;
    try { device = await adapter.requestDevice(); } catch(e) { showError('Failed to get WebGPU device: ' + e.message); return; }
    device.lost.then(info => { console.warn('WebGPU device lost:', info.reason, info.message); });
    const ctx = canvas.getContext('webgpu');
    if (!ctx) { showError('Could not get WebGPU canvas context.'); return; }
    const format = navigator.gpu.getPreferredCanvasFormat();
    try { ctx.configure({ device, format, alphaMode: 'opaque' }); } catch(e) { showError('Canvas configure failed: ' + e.message); return; }

    // Shader module with compilation check
    const module = device.createShaderModule({ code: WGSL });
    const compInfo = await module.getCompilationInfo();
    const compErrors = compInfo.messages.filter(m => m.type === 'error');
    if (compErrors.length) { showError('Shader compile: ' + compErrors.map(e => e.message).join('; ')); return; }

    // Buffers
    const uniformBuf = device.createBuffer({ size: 128, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const sphereBuf = device.createBuffer({ size: MAX_SPHERES * 32, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const ringBuf = device.createBuffer({ size: MAX_RINGS * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });

    // Bind group layout & pipeline
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
            { binding: 1, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } },
            { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } },
        ]
    });
    const bindGroup = device.createBindGroup({
        layout: bgl,
        entries: [
            { binding: 0, resource: { buffer: uniformBuf } },
            { binding: 1, resource: { buffer: sphereBuf } },
            { binding: 2, resource: { buffer: ringBuf } },
        ]
    });
    const pipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        vertex: { module, entryPoint: 'vs' },
        fragment: { module, entryPoint: 'fs', targets: [{ format }] },
        primitive: { topology: 'triangle-list' },
    });

    // ─── Render Loop ───────────────────────────────────────────────
    function frame() {
        requestAnimationFrame(frame);
        time += orbitSpeed / 60;

        const dpr = devicePixelRatio;
        const w = Math.floor(canvas.clientWidth * dpr);
        const h = Math.floor(canvas.clientHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w; canvas.height = h;
        }

        // Camera
        const eyeX = camDist * Math.sin(camRotY) * Math.cos(camRotX);
        const eyeY = camDist * Math.sin(camRotX);
        const eyeZ = camDist * Math.cos(camRotY) * Math.cos(camRotX);
        const view = mat4LookAt([eyeX, eyeY, eyeZ], [0,0,0], [0,1,0]);
        const proj = mat4Perspective(Math.PI / 4, w / h, 0.1, 100);
        const vp = mat4Mul(proj, view);
        const invVP = mat4Invert(vp);

        // Build sphere data
        const el = ELEMENTS[currentElement];
        const sphereData = new Float32Array(MAX_SPHERES * 8);
        let si = 0;
        nucleons.forEach(n => {
            const wb = Math.sin(time * n.wS + n.wP) * n.wA;
            sphereData[si*8+0] = n.pos[0] + wb;
            sphereData[si*8+1] = n.pos[1] + wb * 0.7;
            sphereData[si*8+2] = n.pos[2] + wb * 0.5;
            sphereData[si*8+3] = 0.2;
            const c = n.isProton ? COL_PROTON : COL_NEUTRON;
            sphereData[si*8+4] = c[0]; sphereData[si*8+5] = c[1]; sphereData[si*8+6] = c[2];
            sphereData[si*8+7] = 0.5;
            si++;
        });
        electrons.forEach(e => {
            const a = time * e.speed + e.phase;
            const x = Math.cos(a) * e.orbitRadius, z = Math.sin(a) * e.orbitRadius;
            const cX = Math.cos(e.tiltX), sX = Math.sin(e.tiltX);
            const cZ = Math.cos(e.tiltZ), sZ = Math.sin(e.tiltZ);
            const y1 = -z * sX, z1 = z * cX;
            const x2 = x * cZ - y1 * sZ, y2 = x * sZ + y1 * cZ;
            sphereData[si*8+0] = x2; sphereData[si*8+1] = y2; sphereData[si*8+2] = z1;
            sphereData[si*8+3] = 0.12;
            sphereData[si*8+4] = COL_ELECTRON[0]; sphereData[si*8+5] = COL_ELECTRON[1]; sphereData[si*8+6] = COL_ELECTRON[2];
            sphereData[si*8+7] = 1.5;
            si++;
        });
        const sphereCount = si;

        // Build ring data
        const ringData = new Float32Array(MAX_RINGS * 4);
        let ri = 0;
        el.shells.forEach((_, shellIdx) => {
            ringData[ri*4+0] = 2.0 + shellIdx * 1.2;
            ringData[ri*4+1] = shellIdx * 0.4 + 0.2;
            ringData[ri*4+2] = shellIdx * 0.7;
            ringData[ri*4+3] = 0;
            ri++;
        });
        const ringCount = ri;

        // Uniform data (128 bytes)
        const uData = new Float32Array(32);
        uData.set(invVP, 0);                   // mat4 invVP: 16 floats @ offset 0
        uData[16] = eyeX; uData[17] = eyeY; uData[18] = eyeZ; uData[19] = time;  // camPosTime
        uData[20] = w; uData[21] = h; uData[22] = sphereCount; uData[23] = ringCount; // resCounts
        uData[24] = 5; uData[25] = 8; uData[26] = 6; uData[27] = 0;  // lightPos

        device.queue.writeBuffer(uniformBuf, 0, uData);
        device.queue.writeBuffer(sphereBuf, 0, sphereData);
        device.queue.writeBuffer(ringBuf, 0, ringData);

        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({
            colorAttachments: [{
                view: ctx.getCurrentTexture().createView(),
                loadOp: 'clear',
                storeOp: 'store',
                clearValue: { r: 0.02, g: 0.03, b: 0.06, a: 1 },
            }]
        });
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);
        pass.draw(3);
        pass.end();
        device.queue.submit([encoder.finish()]);
    }

    requestAnimationFrame(frame);
}

init();
    </script>
</body>
</html>
