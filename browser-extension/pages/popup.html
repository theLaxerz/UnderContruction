<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Control API</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>DOM Control API</h1>
      <div class="connection-status" id="connectionStatus">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Connection Panel -->
    <section class="panel">
      <h2>API Connection</h2>
      <div class="connection-controls">
        <button id="connectBtn" class="btn btn-primary">Connect</button>
        <button id="disconnectBtn" class="btn btn-secondary" disabled>Disconnect</button>
        <button id="settingsBtn" class="btn btn-icon" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- Quick Actions Panel -->
    <section class="panel">
      <h2>Quick Actions</h2>
      <div class="quick-actions">
        <button id="pickerBtn" class="btn btn-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          Element Picker
        </button>
        <button id="pageInfoBtn" class="btn btn-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 16v-4"></path>
            <path d="M12 8h.01"></path>
          </svg>
          Page Info
        </button>
        <button id="screenshotBtn" class="btn btn-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <path d="m21 15-5-5L5 21"></path>
          </svg>
          Screenshot
        </button>
        <button id="highlightBtn" class="btn btn-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m9 11-6 6v3h9l3-3"></path>
            <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path>
          </svg>
          Highlight
        </button>
      </div>
    </section>

    <!-- Command Console -->
    <section class="panel">
      <h2>Command Console</h2>
      <div class="console">
        <div class="command-input">
          <label for="commandCategory">Category:</label>
          <select id="commandCategory">
            <option value="select">select</option>
            <option value="create">create</option>
            <option value="manipulate">manipulate</option>
            <option value="content">content</option>
            <option value="attributes">attributes</option>
            <option value="classes">classes</option>
            <option value="style">style</option>
            <option value="events">events</option>
            <option value="traverse">traverse</option>
            <option value="dimensions">dimensions</option>
            <option value="form">form</option>
            <option value="data">data</option>
            <option value="utils">utils</option>
          </select>
        </div>
        <div class="command-input">
          <label for="commandMethod">Method:</label>
          <select id="commandMethod"></select>
        </div>
        <div class="command-input">
          <label for="commandArgs">Arguments (JSON):</label>
          <textarea id="commandArgs" placeholder='["#myElement", "newValue"]'></textarea>
        </div>
        <div class="command-actions">
          <button id="executeBtn" class="btn btn-primary">Execute</button>
          <button id="clearOutputBtn" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </section>

    <!-- Output Panel -->
    <section class="panel">
      <h2>Output</h2>
      <div id="outputArea" class="output-area">
        <p class="output-placeholder">Execute a command to see results...</p>
      </div>
    </section>

    <!-- Element Info Panel (hidden by default) -->
    <section class="panel" id="elementInfoPanel" style="display: none;">
      <h2>Selected Element</h2>
      <div id="elementInfo" class="element-info"></div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
